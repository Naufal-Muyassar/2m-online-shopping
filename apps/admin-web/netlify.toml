[build]
  base = "/"
  command = "pnpm install --frozen-lockfile && pnpm --filter admin-web build"
  publish = "apps/admin-web/dist"

[build.environment]
  NODE_VERSION = "20"

# Replace api.example.com with the real API domain.
[[redirects]]
  from = "/api/*"
  to = "https://api.example.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
