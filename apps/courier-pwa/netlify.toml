[build]
  base = "/"
  command = "pnpm install --frozen-lockfile && pnpm --filter courier-pwa build"
  publish = "apps/courier-pwa/dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Replace api.example.com with the real API domain.
[[redirects]]
  from = "/api/*"
  to = "https://api.example.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
