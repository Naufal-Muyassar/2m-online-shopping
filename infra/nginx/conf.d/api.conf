# Replace api.example.com with the real API domain (cert path must match certbot).
upstream api_upstream {
  server api:3000;
}

server {
  listen 80;
  server_name api.example.com;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api_upstream;
  }

  location /api/v1/webhooks/ {
    limit_req zone=webhooks burst=30 nodelay;
    proxy_pass http://api_upstream;
  }

  location /api/ { proxy_pass http://api_upstream; }
  location = /health { proxy_pass http://api_upstream; }
}
