services:
  - type: web
    name: 2m-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: proofs
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"

  - type: web
    name: 2m-courier-pwa
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter courier-pwa build
    staticPublishPath: apps/courier-pwa/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://2m-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: 2m-admin-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter admin-web build
    staticPublishPath: apps/admin-web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://2m-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
